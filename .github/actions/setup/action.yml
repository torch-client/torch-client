name: Setup
description: Setup the stuff

inputs:
  cache-key:
    description: Cargo cache key, one per job
    required: true
  target:
    description: Extra rustup target
    default: ""
  free-disk:
    description: Delete preinstalled SDKs this build does not use
    default: "true"

runs:
  using: composite
  steps:
    - if: inputs.free-disk == 'true'
      shell: bash
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

    - shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
        rustup toolchain install "$channel" --profile minimal
        if [ -n "$TARGET" ]; then
          rustup target add --toolchain "$channel" "$TARGET"
        fi

    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.cache-key }}
