name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      draft:
        description: Publish the release as a draft
        type: boolean
        default: true
      android:
        description: Also build the Android APK
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        env:
          EVENT: ${{ github.event_name }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          manifest="$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' android/AndroidManifest.xml)"
          if [ "$version" != "$manifest" ]; then
            echo "Cargo.toml says $version, android/AndroidManifest.xml says $manifest" >&2
            exit 1
          fi
          if [ "$EVENT" = workflow_dispatch ] && git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged; bump the version first" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          cache-key: linux

      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev

      - run: tools/build_desktop.sh --features desktop
      - run: tools/build_desktop.sh --features desktop_clickgui

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.zip
          if-no-files-found: error

  windows:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          cache-key: windows
          target: x86_64-pc-windows-gnu

      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64

      - run: tools/build_desktop.sh --windows --features desktop
      - run: tools/build_desktop.sh --windows --features desktop_clickgui

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  web:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [web, web_mobile]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ matrix.preset }}
          target: wasm32-unknown-unknown

      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libc++-dev

      - run: |
          version="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)"
          cargo install wasm-bindgen-cli --version "$version" --locked

      - env:
          NAME: ${{ matrix.preset }}
        run: |
          tools/build_web.sh --harden --features "$NAME"
          python3 tools/pack_single_html.py "web-output/$NAME/site"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preset }}
          path: dist/*.html
          if-no-files-found: error

  android:
    if: inputs.android
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: ./.github/actions/setup
        with:
          cache-key: android
          target: aarch64-linux-android
          free-disk: "false"

      - run: |
          ndk="$(sed -n 's/^NDK_VERSION=//p' tools/build_android.sh)"
          build_tools="$(sed -n 's/^BUILD_TOOLS_VERSION=//p' tools/build_android.sh)"
          platform="$(sed -n 's/^PLATFORM_VERSION=//p' tools/build_android.sh)"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" "build-tools;$build_tools" "platforms;$platform"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"

      - env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KS_PASS: ${{ secrets.ANDROID_KS_PASS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "the ANDROID_KEYSTORE_B64 secret is not set" >&2
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          RELEASE=1 ANDROID_DEBUG_KEYSTORE="$RUNNER_TEMP/release.keystore" tools/build_android.sh --features android

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'torch-client/torch-client' && !cancelled() && !failure()
    needs: [version, linux, windows, web, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.version.outputs.version }}
          DRAFT: ${{ inputs.draft }}
          ANDROID: ${{ inputs.android }}
        run: |
          ls -l dist
          expected=6
          if [ "$ANDROID" = true ]; then
            expected=7
          fi
          count="$(find dist -maxdepth 1 -type f | wc -l)"
          if [ "$count" -ne "$expected" ]; then
            echo "expected $expected release files, found $count" >&2
            exit 1
          fi
          draft=()
          if [ "$DRAFT" = true ]; then
            draft=(--draft)
          fi
          gh release create "v$VERSION" dist/* \
            --repo "$REPO" \
            --target "$SHA" \
            --title "v$VERSION" \
            --generate-notes \
            "${draft[@]}"
